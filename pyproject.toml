[project]
name = "imgw-weather-etl"
version = "0.1.0"
description = "ETL pipeline loading public IMGW weather data into PostgreSQL."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.14.3",
    "pandas==3.0.1",
    "psycopg2-binary==2.9.11",
    "python-dotenv==1.2.2",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "SQLAlchemy==2.0.48",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
